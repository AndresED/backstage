apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: orders-api
  description: Contrato HTTP de pedidos
spec:
  type: openapi
  lifecycle: production
  owner: commerce-team
  system: commerce-platform
  definition: |
    openapi: "3.0.3"
    info:
      title: Orders API
      version: "1.2.0"
    servers:
      - url: http://ms-orders.acme.svc.cluster.local
    paths:
      /v1/orders:
        get:
          operationId: listOrders
          summary: Lista pedidos
          responses:
            "200":
              description: Página de pedidos
        post:
          operationId: createOrder
          summary: Crea un pedido y publica order.created
          responses:
            "202":
              description: Pedido aceptado
      /v1/orders/{orderId}:
        get:
          operationId: getOrder
          summary: Consulta un pedido
          parameters:
            - name: orderId
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Pedido
