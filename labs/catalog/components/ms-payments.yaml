apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ms-payments
  description: Autoriza cobros y publica payment.authorized
  tags:
    - nestjs
    - typescript
  annotations:
    github.com/project-slug: acme/ms-payments
    backstage.io/kubernetes-id: ms-payments
    backstage.io/kubernetes-namespace: acme
  links:
