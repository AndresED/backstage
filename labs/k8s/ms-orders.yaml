apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-orders
  namespace: acme
  labels:
    app: ms-orders
    backstage.io/kubernetes-id: ms-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-orders
  template:
    metadata:
      labels:
        app: ms-orders
        backstage.io/kubernetes-id: ms-orders
    spec:
      containers:
        - name: ms-orders
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ms-orders
  namespace: acme
  labels:
    app: ms-orders
    backstage.io/kubernetes-id: ms-orders
spec:
  selector:
    app: ms-orders
  ports:
    - port: 80
      targetPort: 80
